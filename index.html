<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t</title>
  <!-- קישור לקובץ המניפסט החיצוני -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">

  <div class="text-center p-8 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4">
    <h1 class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">שלום עולם! 👋</h1>
    <p class="text-sm text-slate-400">אפליקציית PWA תקנית לחלוטין שעובדת בגוגל כרום בנייד.</p>
    
    <div id="status" class="mt-6 text-xs bg-slate-900/60 py-2 px-4 rounded-xl border border-slate-700/50 inline-block text-amber-400 font-medium">
      בודק סטטוס Service Worker...
    </div>
  </div>

  <script>
    // רישום ה-Service Worker בצורה תקנית לאחר טעינת העמוד
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            const status = document.getElementById('status');
            status.className = "mt-6 text-xs bg-emerald-500/10 py-2 px-4 rounded-xl border border-emerald-500/30 inline-block text-emerald-400 font-medium";
            status.innerText = "ה-Service Worker נרשם בהצלחה! ✓";
          })
          .catch(err => {
            const status = document.getElementById('status');
            status.className = "mt-6 text-xs bg-rose-500/10 py-2 px-4 rounded-xl border border-rose-500/30 inline-block text-rose-400 font-medium";
            status.innerText = "שגיאה ברישום הרכיב: " + err.message;
          });
      });
    } else {
      document.getElementById('status').innerText = "הדפדפן אינו תומך ב-PWA";
    }
  </script>
</body>
</html>
